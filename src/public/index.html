<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Url</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center">Little Url</h1>
    <div class="card p-4">
      <form id="urlForm">
        <div class="form-group">
          <label for="targetUrl">Enter URL</label>
          <input type="url" class="form-control" id="targetUrl" placeholder="https://example.com" required>
        </div>
        <div class="form-group">
          <label for="ttlSeconds">TTL (Seconds)</label>
          <input type="number" class="form-control" id="ttlSeconds" placeholder="3600">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Shorten URL</button>
      </form>
      <div class="mt-3" id="result"></div>
    </div>
  </div>

  <!-- Custom JS -->
  <script src="/script.js"></script>
</body>
</html>
